name: Gradle Package

on:
  push:
    branches:
      - 2.0
  #workflow_dispatch:
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: adyeshach
        path: ${{ github.workspace }}/plugin/build/output/libs/*.jar

    - name: Get the jar filename
      id: get_jar_name
      run: |
        JAR_FILE=$(ls ${{ github.workspace }}/plugin/build/output/libs/*.jar | head -n 1)
        JAR_FILENAME=$(basename "$JAR_FILE" .jar)
        echo "JAR_FILENAME=$JAR_FILENAME" >> $GITHUB_ENV
      continue-on-error: false
        
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.JAR_FILENAME }}
        files: ${{ github.workspace }}/plugin/build/output/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
